services:
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
      - "5552:5552"
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_stream advertised_host rabbitmq'  # Use the service name here
    command: >
      bash -c "
        rabbitmq-plugins enable --offline rabbitmq_stream &&
        rabbitmq-plugins enable --offline rabbitmq_stream_management &&
        rabbitmq-server
      "

  # Kafka Connect from the same Apache Kafka image. It loads the unpacked component archive from
  # build/plugin (produced by ./gradlew build) and discovers plugins only via ServiceLoader manifests.
  connect:
    image: apache/kafka:4.4.0
    depends_on:
      - kafka
      - rabbitmq
    ports:
      - "8083:8083"
    volumes:
      - ./build/plugin:/opt/plugins:ro
    command:
      - bash
      - -c
      - |
        cat > /tmp/connect-worker.properties <<'PROPS'
        bootstrap.servers=kafka:19092
        listeners=http://0.0.0.0:8083
        rest.advertised.host.name=localhost
        group.id=rabbit-source-connect
        config.storage.topic=connect-configs
        offset.storage.topic=connect-offsets
        status.storage.topic=connect-status
        config.storage.replication.factor=1
        offset.storage.replication.factor=1
        status.storage.replication.factor=1
        key.converter=org.apache.kafka.connect.storage.StringConverter
        value.converter=org.apache.kafka.connect.storage.StringConverter
        plugin.path=/opt/plugins
        plugin.discovery=service_load
        PROPS
        exec /opt/kafka/bin/connect-distributed.sh /tmp/connect-worker.properties
